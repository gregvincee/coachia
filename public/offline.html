<!doctype html>
<html lang="fr-CA">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#6366F1" />
    <title>CoachIA — Hors ligne</title>
    <style>
      :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      body { align-items: center; background: #f8f9fb; color: #1e293b; display: flex; justify-content: center; margin: 0; min-height: 100vh; padding: 24px; text-align: center; }
      main { max-width: 360px; }
      .mark { align-items: center; background: #6366f1; border-radius: 24px; color: white; display: inline-flex; font-size: 28px; font-weight: 800; height: 64px; justify-content: center; margin-bottom: 22px; width: 64px; }
      h1 { font-size: 24px; margin: 0 0 10px; }
      p { color: #64748b; font-size: 16px; line-height: 1.5; margin: 0; }
      button { background: #6366f1; border: 0; border-radius: 14px; color: white; font: inherit; font-weight: 700; margin-top: 24px; padding: 13px 18px; }
      @media (prefers-color-scheme: dark) { body { background: #0f0f1a; color: #f1f5f9; } p { color: #94a3b8; } }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">C</div>
      <h1>CoachIA est hors ligne</h1>
      <p>Vérifiez votre connexion, puis réessayez. Les contenus déjà ouverts peuvent rester accessibles.</p>
      <button type="button" onclick="window.location.reload()">Réessayer</button>
    </main>
  </body>
</html>
